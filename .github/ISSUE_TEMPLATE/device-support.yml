name: Device Support Request
description: Request support for an untested or incompatible device partition layout
title: "[Device Support]: "
labels: ["enhancement", "device-support"]
body:
  - type: markdown
    attributes:
      value: |
        Use this issue template when `./scripts/check-device.sh` flags an unsupported API level or an unrecognized partition layout.
        The preflight report block below is generated automatically by running `./scripts/check-device.sh` on your host machine.
  - type: input
    id: device
    attributes:
      label: Device Model & Codename
      description: e.g. Nexus 5X (bullhead), Redmi Note 5 (whyred), IT-701A
      placeholder: e.g. Nexus 5X (bullhead)
    validations:
      required: true
  - type: input
    id: api_level
    attributes:
      label: Android API Level
      description: Android SDK version reported by getprop ro.build.version.sdk
      placeholder: e.g. 27
    validations:
      required: true
  - type: input
    id: rom
    attributes:
      label: ROM / OS Build
      description: Stock OEM firmware version or custom ROM name
      placeholder: e.g. Stock OPM7, LineageOS 18.1
    validations:
      required: true
  - type: dropdown
    id: root_manager
    attributes:
      label: Root Manager
      description: Root manager active on the device
      options:
        - Magisk
        - KernelSU / KernelSU Next / SukiSU
        - APatch
        - None / Other
    validations:
      required: true
  - type: dropdown
    id: spoofing
    attributes:
      label: Signature Spoofing Status
      description: Does your ROM support signature spoofing?
      options:
        - Supported (verified via microG Self-Check)
        - Supported (ROM feature / patch)
        - Unknown
        - Not supported
    validations:
      required: true
  - type: textarea
    id: support_report
    attributes:
      label: Device Support Report
      description: Paste the complete DEVICE SUPPORT REPORT markdown block generated by scripts/check-device.sh.
      placeholder: |
        ```markdown
        ### DEVICE SUPPORT REPORT
        ...
        ```
    validations:
      required: true
