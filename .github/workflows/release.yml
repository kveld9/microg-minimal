name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'customize.sh.template'
      - 'scripts/**'
      - 'system/**'
      - 'META-INF/**'
      - 'uninstall.sh'
      - 'sepolicy.rule'
      - 'module.prop'
      - 'versions.env'
      - '.github/workflows/release.yml'
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Package & Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate Shell Script Syntax
        run: |
          bash -n scripts/*.sh customize.sh.template uninstall.sh META-INF/com/google/android/update-binary

      - name: Check Existing Release Guard
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            echo "is_tag_run=true" >> "$GITHUB_OUTPUT"
            echo "is_bump=false" >> "$GITHUB_OUTPUT"
            if gh release view "${TAG}" >/dev/null 2>&1; then
              echo "Release for tag ${TAG} already exists. Skipping publish."
              echo "skip_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "skip_release=false" >> "$GITHUB_OUTPUT"
            fi
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "is_tag_run=false" >> "$GITHUB_OUTPUT"
            python3 - << 'PYEOF'
            import json, os, re, subprocess

            def parse_semver(tag_str):
                raw = tag_str.lstrip("v")
                parts = raw.split(".")
                if len(parts) >= 4 and len(parts[-1]) >= 6 and parts[-1].isdigit():
                    parts = parts[:-1]
                nums = [int(p) if p.isdigit() else 0 for p in parts[:3]]
                while len(nums) < 3:
                    nums.append(0)
                return tuple(nums)

            # 1. Read V from versions.env
            V = None
            with open("versions.env", "r", encoding="utf-8") as f:
                for line in f:
                    m = re.match(r'^MODULE_VERSION=["\']?([^"\']+)["\']?', line.strip())
                    if m:
                        V = m.group(1).strip()
                        break
            if not V:
                raise SystemExit("Error: MODULE_VERSION not found in versions.env")
            V_tag = f"v{V.lstrip('v')}"

            # 2. Get tags and find T
            tag_out = subprocess.check_output(["git", "tag", "-l", "v*"], text=True).strip()
            raw_tags = [t.strip() for t in tag_out.splitlines() if t.strip()]
            valid_tags = []
            for t in raw_tags:
                try:
                    valid_tags.append((parse_semver(t), t))
                except Exception:
                    pass
            valid_tags.sort(key=lambda x: x[0])
            T = valid_tags[-1][1] if valid_tags else None
            tag_names = {t[1] for t in valid_tags}
            has_v_tag = V_tag in tag_names

            SKIP_RELEASE = False
            IS_BUMP = False
            NEXT_CODE = None

            if not has_v_tag or not T:
                TAG = V_tag
                print(f"V ({TAG}) has no tag in repository. Releasing V as-is.")
            else:
                trigger_paths = [
                    "customize.sh.template",
                    "scripts/",
                    "system/",
                    "META-INF/",
                    "uninstall.sh",
                    "sepolicy.rule",
                    "module.prop",
                    "versions.env",
                ]
                diff_cmd = ["git", "diff", "--name-only", f"{T}..HEAD", "--"] + trigger_paths
                diff_out = subprocess.check_output(diff_cmd, text=True).strip()
                if not diff_out:
                    TAG = T
                    SKIP_RELEASE = True
                    print(f"No changes in module-code trigger set since {T}. Skipping publish.")
                else:
                    v_maj, v_min, v_pat = parse_semver(V)
                    t_maj, t_min, t_pat = parse_semver(T)
                    if (v_maj, v_min) > (t_maj, t_min):
                        next_maj, next_min, next_pat = v_maj, v_min, v_pat
                    else:
                        base = max((v_maj, v_min, v_pat), (t_maj, t_min, t_pat))
                        next_maj, next_min, next_pat = base[0], base[1], base[2] + 1
                    NEXT = f"v{next_maj}.{next_min}.{next_pat}"
                    NEXT_CODE = (next_maj * 100000) + (next_min * 10000) + (next_pat * 10)
                    TAG = NEXT
                    IS_BUMP = True
                    print(f"Trigger set changed since {T}:\n{diff_out}")
                    print(f"Resolved NEXT version: {NEXT} (versionCode {NEXT_CODE})")

                    # In-runner override for computed NEXT
                    with open("versions.env", "r", encoding="utf-8") as f:
                        env_content = f.read()
                    env_content = re.sub(r'MODULE_VERSION="[^"]*"', f'MODULE_VERSION="{NEXT}"', env_content)
                    env_content = re.sub(r'MODULE_VERSION_CODE="[^"]*"', f'MODULE_VERSION_CODE="{NEXT_CODE}"', env_content)
                    with open("versions.env", "w", encoding="utf-8") as f:
                        f.write(env_content)

                    with open("module.prop", "r", encoding="utf-8") as f:
                        prop_content = f.read()
                    prop_content = re.sub(r"^version=.*$", f"version={NEXT}", prop_content, flags=re.MULTILINE)
                    prop_content = re.sub(r"^versionCode=.*$", f"versionCode={NEXT_CODE}", prop_content, flags=re.MULTILINE)
                    with open("module.prop", "w", encoding="utf-8") as f:
                        f.write(prop_content)

                    with open("update.json", "r", encoding="utf-8") as f:
                        up_data = json.load(f)
                    up_data["version"] = NEXT
                    up_data["versionCode"] = int(NEXT_CODE)
                    up_data["zipUrl"] = f"https://github.com/kveld9/microg-minimal/releases/download/{NEXT}/microg-minimal-{NEXT}.zip"
                    with open("update.json", "w", encoding="utf-8") as f:
                        json.dump(up_data, f, indent=2)
                        f.write("\n")
                    print(f"In-runner metadata overridden for {NEXT}.")

            # Check existing release guard
            if not SKIP_RELEASE:
                tag_check = subprocess.run(["git", "rev-parse", "-q", "--verify", f"refs/tags/{TAG}"], capture_output=True)
                view_res = subprocess.run(["gh", "release", "view", TAG], capture_output=True)
                if tag_check.returncode == 0 or view_res.returncode == 0:
                    print(f"Release or tag for {TAG} already exists. Skipping publish.")
                    SKIP_RELEASE = True

            out_file = os.environ.get("GITHUB_OUTPUT")
            if out_file:
                with open(out_file, "a", encoding="utf-8") as f:
                    f.write(f"skip_release={'true' if SKIP_RELEASE else 'false'}\n")
                    f.write(f"tag={TAG}\n")
                    f.write(f"is_bump={'true' if IS_BUMP else 'false'}\n")
            PYEOF
          fi

      - name: Fetch microG APK Binaries
        if: steps.guard.outputs.skip_release != 'true'
        run: |
          ./scripts/fetch-apks.sh

      - name: Assemble Flashable Magisk Module
        if: steps.guard.outputs.skip_release != 'true'
        run: |
          ./scripts/build-module.sh

      - name: Package Artifacts & Compute Checksums
        if: steps.guard.outputs.skip_release != 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.guard.outputs.tag }}"
          STAGE="artifacts"
          mkdir -p "${STAGE}"

          cp dist/microg-minimal-*.zip "${STAGE}/"

          cd "${STAGE}"
          CHECKSUM_FILE="checksums-${TAG}.txt"
          echo "==================================================" > "${CHECKSUM_FILE}"
          echo " microG Minimal ${TAG} — Integrity Hashes" >> "${CHECKSUM_FILE}"
          echo "==================================================" >> "${CHECKSUM_FILE}"
          echo "" >> "${CHECKSUM_FILE}"

          echo "## SHA-256" >> "${CHECKSUM_FILE}"
          sha256sum microg-minimal-*.zip >> "${CHECKSUM_FILE}"
          echo "" >> "${CHECKSUM_FILE}"

          echo "## SHA-512" >> "${CHECKSUM_FILE}"
          sha512sum microg-minimal-*.zip >> "${CHECKSUM_FILE}"
          echo "" >> "${CHECKSUM_FILE}"

          echo "## MD5" >> "${CHECKSUM_FILE}"
          md5sum microg-minimal-*.zip >> "${CHECKSUM_FILE}"

          sha256sum microg-minimal-*.zip > SHA256SUMS.txt
          cd ..

      - name: Create and Push Git Tag
        if: steps.guard.outputs.skip_release != 'true' && steps.guard.outputs.is_tag_run != 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.guard.outputs.tag }}"
          echo "Creating and pushing tag ${TAG}..."
          git tag "${TAG}"
          git push origin "${TAG}"

      - name: Extract Release Metadata & Changelog
        id: meta
        if: steps.guard.outputs.skip_release != 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.guard.outputs.tag }}"
          . ./versions.env

          PREV_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")"
          if [[ -n "${PREV_TAG}" ]]; then
            COMMITS="$(git log --pretty=format:'- %h %s' "${PREV_TAG}..${TAG}")"
            if [[ -z "${COMMITS}" ]]; then
              COMMITS="- No new commits."
            fi
          else
            COMMITS="Initial release."
          fi

          {
            echo "module_version=${MODULE_VERSION}"
            echo "prev_tag=${PREV_TAG}"
            echo "commits<<COMMITS_EOF"
            echo "${COMMITS}"
            echo "COMMITS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.guard.outputs.skip_release != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.guard.outputs.tag }}
          name: ${{ steps.guard.outputs.tag }}
          body: |
            ## Changes

            ${{ steps.meta.outputs.commits }}

            ## Downloads

            | File | Description |
            |------|-------------|
            | `microg-minimal-${{ steps.meta.outputs.module_version }}.zip` | Flashable Magisk Module |
            | `checksums-${{ steps.guard.outputs.tag }}.txt` | Multi-hash Integrity Verification (SHA-256, SHA-512, MD5) |
            | `SHA256SUMS.txt` | Standard SHA-256 Checksums (`sha256sum -c`) |
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Back update.json
        if: steps.guard.outputs.skip_release != 'true' && steps.guard.outputs.is_bump == 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.guard.outputs.tag }}"
          git checkout versions.env module.prop
          if ! git diff --quiet update.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add update.json
            git commit -m "chore(release): point update channel at ${TAG} [skip ci]"
            git push origin HEAD:main
          fi
