name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Package & Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate Shell Script Syntax
        run: |
          bash -n scripts/*.sh customize.sh uninstall.sh META-INF/com/google/android/update-binary

      - name: Check Existing Release Guard
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release for tag ${TAG} already exists. Skipping publish."
            echo "skip_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch microG APK Binaries
        if: steps.guard.outputs.skip_release != 'true'
        run: |
          ./scripts/fetch-apks.sh

      - name: Assemble Flashable Magisk Module
        if: steps.guard.outputs.skip_release != 'true'
        run: |
          ./scripts/build-module.sh

      - name: Package Artifacts & Compute Checksums
        if: steps.guard.outputs.skip_release != 'true'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          STAGE="artifacts"
          mkdir -p "${STAGE}"

          cp dist/microg-minimal-*.zip "${STAGE}/"

          cd "${STAGE}"
          CHECKSUM_FILE="checksums-${TAG}.txt"
          echo "==================================================" > "${CHECKSUM_FILE}"
          echo " microG Minimal ${TAG} — Integrity Hashes" >> "${CHECKSUM_FILE}"
          echo "==================================================" >> "${CHECKSUM_FILE}"
          echo "" >> "${CHECKSUM_FILE}"

          echo "## SHA-256" >> "${CHECKSUM_FILE}"
          sha256sum microg-minimal-*.zip >> "${CHECKSUM_FILE}"
          echo "" >> "${CHECKSUM_FILE}"

          echo "## SHA-512" >> "${CHECKSUM_FILE}"
          sha512sum microg-minimal-*.zip >> "${CHECKSUM_FILE}"
          echo "" >> "${CHECKSUM_FILE}"

          echo "## MD5" >> "${CHECKSUM_FILE}"
          md5sum microg-minimal-*.zip >> "${CHECKSUM_FILE}"

          sha256sum microg-minimal-*.zip > SHA256SUMS.txt
          cd ..

      - name: Extract Release Metadata & Changelog
        id: meta
        if: steps.guard.outputs.skip_release != 'true'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          . ./versions.env

          CHANGELOG_EXCERPT="$(python3 -c "
          import sys
          tag = '${TAG}'
          try:
              with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
                  content = f.read()
              header = f'## [{tag}]'
              if header in content:
                  part = content.split(header, 1)[1]
                  if '\n## [' in part:
                      body = part.split('\n## [', 1)[0].strip()
                  else:
                      body = part.strip()
                  print(body)
              else:
                  print(f'- Automated release for microG Minimal {tag}')
          except Exception as e:
              print(f'- Automated release for microG Minimal {tag}')
          ")"

          PREV_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")"
          if [[ -n "${PREV_TAG}" ]]; then
            COMMITS="$(git log --pretty=format:'- %h %s' "${PREV_TAG}..${TAG}")"
            if [[ -z "${COMMITS}" ]]; then
              COMMITS="- No new commits."
            fi
          else
            COMMITS="Initial release."
          fi

          {
            echo "changelog<<CHANGELOG_EOF"
            echo "${CHANGELOG_EXCERPT}"
            echo "CHANGELOG_EOF"
            echo "upstream_tag=${GMS_RELEASE_TAG}"
            echo "module_version=${MODULE_VERSION}"
            echo "prev_tag=${PREV_TAG}"
            echo "commits<<COMMITS_EOF"
            echo "${COMMITS}"
            echo "COMMITS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.guard.outputs.skip_release != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## Changes

            ${{ steps.meta.outputs.changelog }}

            ## Release Details

            - **Module Version:** `${{ steps.meta.outputs.module_version }}`
            - **Upstream microG Tag:** [${{ steps.meta.outputs.upstream_tag }}](https://github.com/microg/GmsCore/releases/tag/${{ steps.meta.outputs.upstream_tag }})

            ## Commits

            ${{ steps.meta.outputs.prev_tag != '' && format('**Full changelog**: [{0}...{1}](https://github.com/{2}/compare/{0}...{1})', steps.meta.outputs.prev_tag, github.ref_name, github.repository) || '' }}

            ${{ steps.meta.outputs.commits }}

            ## Downloads

            | File | Description |
            |------|-------------|
            | `microg-minimal-${{ steps.meta.outputs.module_version }}.zip` | Flashable Magisk Module |
            | `checksums-${{ github.ref_name }}.txt` | Multi-hash Integrity Verification (SHA-256, SHA-512, MD5) |
            | `SHA256SUMS.txt` | Standard SHA-256 Checksums (`sha256sum -c`) |
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
