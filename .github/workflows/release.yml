name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Package & Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate Shell Script Syntax
        run: |
          bash -n scripts/*.sh customize.sh.template uninstall.sh META-INF/com/google/android/update-binary

      - name: Check Existing Release Guard
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            if gh release view "${TAG}" >/dev/null 2>&1; then
              echo "Release for tag ${TAG} already exists. Skipping publish."
              echo "skip_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "skip_release=false" >> "$GITHUB_OUTPUT"
            fi
          else
            . ./versions.env
            TAG="v${MODULE_VERSION#v}"
            if git rev-parse "${TAG}" >/dev/null 2>&1 || gh release view "${TAG}" >/dev/null 2>&1; then
              echo "Release or tag for ${TAG} already exists. Skipping publish."
              echo "skip_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "Creating and pushing tag ${TAG}..."
              git tag "${TAG}"
              git push origin "${TAG}"
              echo "skip_release=false" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Fetch microG APK Binaries
        if: steps.guard.outputs.skip_release != 'true'
        run: |
          ./scripts/fetch-apks.sh

      - name: Assemble Flashable Magisk Module
        if: steps.guard.outputs.skip_release != 'true'
        run: |
          ./scripts/build-module.sh

      - name: Package Artifacts & Compute Checksums
        if: steps.guard.outputs.skip_release != 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.guard.outputs.tag }}"
          STAGE="artifacts"
          mkdir -p "${STAGE}"

          cp dist/microg-minimal-*.zip "${STAGE}/"

          cd "${STAGE}"
          CHECKSUM_FILE="checksums-${TAG}.txt"
          echo "==================================================" > "${CHECKSUM_FILE}"
          echo " microG Minimal ${TAG} — Integrity Hashes" >> "${CHECKSUM_FILE}"
          echo "==================================================" >> "${CHECKSUM_FILE}"
          echo "" >> "${CHECKSUM_FILE}"

          echo "## SHA-256" >> "${CHECKSUM_FILE}"
          sha256sum microg-minimal-*.zip >> "${CHECKSUM_FILE}"
          echo "" >> "${CHECKSUM_FILE}"

          echo "## SHA-512" >> "${CHECKSUM_FILE}"
          sha512sum microg-minimal-*.zip >> "${CHECKSUM_FILE}"
          echo "" >> "${CHECKSUM_FILE}"

          echo "## MD5" >> "${CHECKSUM_FILE}"
          md5sum microg-minimal-*.zip >> "${CHECKSUM_FILE}"

          sha256sum microg-minimal-*.zip > SHA256SUMS.txt
          cd ..

      - name: Extract Release Metadata & Changelog
        id: meta
        if: steps.guard.outputs.skip_release != 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.guard.outputs.tag }}"
          . ./versions.env

          PREV_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")"
          if [[ -n "${PREV_TAG}" ]]; then
            COMMITS="$(git log --pretty=format:'- %h %s' "${PREV_TAG}..${TAG}")"
            if [[ -z "${COMMITS}" ]]; then
              COMMITS="- No new commits."
            fi
          else
            COMMITS="Initial release."
          fi

          {
            echo "module_version=${MODULE_VERSION}"
            echo "prev_tag=${PREV_TAG}"
            echo "commits<<COMMITS_EOF"
            echo "${COMMITS}"
            echo "COMMITS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.guard.outputs.skip_release != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.guard.outputs.tag }}
          name: ${{ steps.guard.outputs.tag }}
          body: |
            ## Changes

            ${{ steps.meta.outputs.commits }}

            ## Downloads

            | File | Description |
            |------|-------------|
            | `microg-minimal-${{ steps.meta.outputs.module_version }}.zip` | Flashable Magisk Module |
            | `checksums-${{ steps.guard.outputs.tag }}.txt` | Multi-hash Integrity Verification (SHA-256, SHA-512, MD5) |
            | `SHA256SUMS.txt` | Standard SHA-256 Checksums (`sha256sum -c`) |
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
